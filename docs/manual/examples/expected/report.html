<!doctype html>

<title>Demultiplexing report</title>
<style>
:root{--bg:#ffffff;--card:#f6f5f2;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--sample:#2a78d6;--pseudo:#b9b8b2;--accent:#eb6834;--warn:#fff4e5}
@media (prefers-color-scheme: dark){:root{--bg:#1b1b1a;--card:#262624;--ink:#f2f1ee;--ink2:#b5b3ad;--grid:#3a3936;--sample:#5b9be6;--pseudo:#6d6b66;--accent:#f08a5d;--warn:#3a2e1e}}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;line-height:1.45}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.6em;margin:0.4em 0 0.1em}h1.logo{display:inline-block;margin-top:0.2em}h1.logo img{display:block;width:auto}h1.logo span{display:block;margin-top:6px;font-size:0.6em;font-weight:700;letter-spacing:0.8em;padding-left:0.8em;text-align:center;text-transform:uppercase;color:var(--ink2)}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:0 32px}.head .updated{font-size:0.8em}.head .side{flex:1 1 420px;min-width:0}.head .side>h2:first-child{border-top:none;margin-top:0.4em;padding-top:0}
h2{font-size:1.3em;margin:1.6em 0 0.4em;padding-top:0.6em;border-top:2px solid var(--grid)}h3{font-size:1.05em;margin:1.2em 0 0.3em}
.sub{color:var(--ink2);margin:0}.tiles{display:flex;flex-wrap:wrap;gap:10px;margin:0.8em 0}
.tile{background:var(--card);border-radius:8px;padding:8px 14px;min-width:140px}.tile .v{font-size:1.5em;font-weight:600}.tile .l{color:var(--ink2);font-size:0.85em}
table{border-collapse:collapse;font-size:0.9em;margin:0.4em 0}th,td{padding:3px 10px;text-align:right;border-bottom:1px solid var(--grid)}th{color:var(--ink2);font-weight:600}td:first-child,th:first-child{text-align:left}
td.seq{font-family:ui-monospace,monospace;text-align:left}
.note{color:var(--ink2);font-size:0.85em}.running{background:var(--warn);border-radius:8px;padding:8px 14px}
code{font-family:ui-monospace,monospace;font-size:0.9em;word-break:break-all}
svg{max-width:100%;height:auto;display:block}svg text{fill:var(--ink);font-size:11px;font-family:inherit}
svg .muted{fill:var(--ink2)}svg .grid{stroke:var(--grid)}svg .halo{paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}svg .axis{stroke:var(--ink2)}
svg .s{fill:var(--sample)}svg .p{fill:var(--pseudo)}svg .a{stroke:var(--accent);fill:none}svg .line{stroke:var(--sample);fill:none;stroke-width:2}
</style>
</head>
